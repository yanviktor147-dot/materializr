name: android-build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Accept SDK licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Restore NDK version
        run: |
          if grep -q "26.3.11579264" android/app/build.gradle; then
            sed -i "s/26.3.11579264/28.2.13676358/" android/app/build.gradle
          fi

      - name: Native deps (SDL3 + FreeType + OCCT)
        run: bash android/scripts/setup-deps.sh
        env:
          JOBS: "4"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: materializr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
